<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ComOffice viewer</title>
<script type="module" src="comofficekit-viewer.js"></script>
<style>
  body { margin: 0; font: 15px system-ui, sans-serif; background: #f8f9fa; color: #1d2329; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p { margin: 0 0 12px; color: #5c6670; }
  label { display: inline-block; margin-bottom: 12px; }
  comofficekit-viewer { height: calc(100vh - 150px); background: #fff; }
</style>
</head>
<body>
<main>
  <h1>ComOffice viewer</h1>
  <p>Word, Excel and PowerPoint documents, drawn by this service as one image per page.</p>
  <label>Choose a document: <input type="file" id="picker" accept=".docx,.xlsx,.xlsm,.pptx,.csv,.tsv"></label>
  <comofficekit-viewer id="viewer"></comofficekit-viewer>
</main>
<script type="module">
const picker = document.getElementById('picker');
const viewer = document.getElementById('viewer');
picker.addEventListener('change', () => {
  const file = picker.files[0];
  // The component says what went wrong in its own toolbar, and in its error event.
  if (file) viewer.open(file).catch(() => {});
});
</script>
</body>
</html>
